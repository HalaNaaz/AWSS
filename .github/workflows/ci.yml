name: Ashlynx WebSec Scanner Quality & Security CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python backend and CLI test suites with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALLOW_PRIVATE_IPS: "false"
        run: |
          pytest backend/tests cli/tests -v --cov=backend/app --cov-report=xml

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and build Next.js application
        run: |
          npm run lint
          npm run build

      - name: Audit npm production and dev dependencies
        run: npm audit --audit-level=high

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit SAST Security Audit
        run: |
          pip install bandit
          bandit -r backend/app cli/ashlynx -ll -ii

      - name: Check for Hardcoded Secrets
        run: |
          echo "Verifying no live production secrets in repository..."
