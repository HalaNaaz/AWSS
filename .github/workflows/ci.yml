name: Ashlynx WebSec Scanner Quality & Security CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Python unit tests with coverage
        run: |
          export PYTHONPATH=$PWD
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit SAST Security Audit
        run: |
          pip install bandit
          bandit -r backend/app cli/ashlynx -ll -ii

      - name: Check for Hardcoded Secrets
        run: |
          echo "Verifying no live production secrets in repository..."
