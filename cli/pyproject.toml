[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashlynx-cli"
version = "2.0.0.dev0"
description = "Ashlynx WebSec Scanner - Command Line Interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AshlynxCyber Security Systems", email = "security@ashlynxcyber.in" }
]
dependencies = [
    "typer>=0.12.5",
    "rich>=13.9.4",
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0"
]

[project.scripts]
ashlynx = "ashlynx.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.3"
]
